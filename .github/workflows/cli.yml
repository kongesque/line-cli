name: LINE CLI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LINE_CLI_LIVE_READ: "0"
  LINE_CLI_LIVE_WATCH: "0"
  LINE_CLI_LIVE_SECURITY_READ: "0"
  LINE_CLI_LIVE_SECURITY_SEND: "0"

jobs:
  crypto:
    name: Runner and LTSM regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Verify security toolchain
        shell: bash
        run: ./scripts/check-toolchain.sh
      - name: Test signing and encryption runtime
        run: go test -count=1 -timeout=20m ./pkg ./pkg/ltsm

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Verify security toolchain
        shell: bash
        run: ./scripts/check-toolchain.sh
      - name: Test CLI and protocol packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test ./internal/... ./cmd/line ./pkg/line/... ./pkg/e2ee
          else
            go test -race ./internal/... ./cmd/line ./pkg/line/... ./pkg/e2ee
          fi
          go vet ./internal/... ./cmd/line ./pkg/line ./pkg/e2ee ./pkg
      - name: Format and static analysis
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l internal cmd/line)"
          go run honnef.co/go/tools/cmd/staticcheck@latest ./internal/... ./cmd/line ./pkg/line ./pkg/e2ee ./pkg
      - name: Native Linux Secret Service integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools dbus
          keyring_test_dir=$(mktemp -d)
          trap 'rm -rf "$keyring_test_dir"' EXIT
          export XDG_DATA_HOME="$keyring_test_dir/data"
          export XDG_RUNTIME_DIR="$keyring_test_dir/run"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export LINE_CLI_TEST_SECRET_SERVICE=1
          export LINE_CLI_TEST_KEYRING_LOCK=1
          dbus-run-session -- bash -eu -c '
            printf %s ci-synthetic-keyring-password | gnome-keyring-daemon --unlock --components=secrets
            gnome-keyring-daemon --start --components=secrets
            dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets org.freedesktop.Secret.Service.SetAlias string:default objpath:/org/freedesktop/secrets/collection/login >/dev/null
            go test -v -count=1 ./internal/session -run "^TestLinuxNativeSecretService$"
          '
      - name: Native Windows DPAPI integration
        if: runner.os == 'Windows'
        shell: bash
        run: go test -v -count=1 ./internal/session -run '^TestDPAPI'
      - name: Build CLI
        shell: bash
        run: ./build.sh
      - name: Scan source and built binary
        shell: bash
        run: |
          binary=./bin/line
          if [ "$RUNNER_OS" = "Windows" ]; then binary=./bin/line.exe; fi
          ./scripts/security-check.sh "$binary"
      - name: Validate POSIX installer
        shell: bash
        run: sh -n scripts/install-release.sh
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/install-release.ps1)) | Out-Null'
